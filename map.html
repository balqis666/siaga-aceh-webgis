<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIAGA ACEH - WebGIS Viewer & Layer Control</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 72px); width: 100%; z-index: 10; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen overflow-hidden font-sans">

  <!-- ================= NAVBAR ATAS (PERSIS SEPERTI GAMBAR SIAGA) ================= -->
  <nav class="h-[72px] bg-white border-b border-slate-200 px-4 md:px-8 flex items-center justify-between z-30 shadow-sm">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
      <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-xl shadow-md shadow-emerald-600/20">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h1 class="font-black text-xl text-slate-900 tracking-tight flex items-center gap-1.5">
          SIAGA <span class="text-emerald-600 font-bold">ACEH</span>
        </h1>
        <p class="text-[10px] text-slate-500 font-medium -mt-1">Sistem Informasi Kebencanaan</p>
      </div>
    </div>

    <!-- Navigation Menu Items -->
    <div class="hidden lg:flex items-center space-x-7 text-xs md:text-sm font-bold tracking-wide uppercase text-slate-700">
      <a href="index.html" class="hover:text-emerald-600 transition">Beranda</a>
      <a href="map.html" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">Peta</a>
      <a href="index.html#bencana-terbaru" class="hover:text-emerald-600 transition">Bencana Terbaru</a>
      
      <div class="relative group cursor-pointer py-2">
        <span class="hover:text-emerald-600 flex items-center gap-1">Info Kebencanaan <i class="fa-solid fa-chevron-down text-[10px]"></i></span>
        <div class="absolute top-full left-0 bg-white border border-slate-200 rounded-xl shadow-xl py-2 w-48 hidden group-hover:block lowercase text-slate-600 normal-case z-50">
          <a href="dashboard.html" class="block px-4 py-2 hover:bg-slate-50 hover:text-emerald-600">Dashboard Statistik</a>
          <a href="index.html#destana" class="block px-4 py-2 hover:bg-slate-50 hover:text-emerald-600">Gampong Destana</a>
        </div>
      </div>

      <a href="katalog.html" class="hover:text-emerald-600 transition">Data/Dokumen</a>
      <a href="admin.html" class="hover:text-emerald-600 transition">Lapor Bencana</a>
    </div>

    <!-- Login Button -->
    <div>
      <a href="admin.html" class="inline-flex items-center gap-2 border-2 border-slate-800 text-slate-800 hover:bg-slate-900 hover:text-white px-5 py-2 rounded-full font-bold text-xs uppercase tracking-wider transition shadow-sm">
        Login <i class="fa-solid fa-arrow-right text-[11px]"></i>
      </a>
    </div>
  </nav>

  <!-- ================= MAP CONTAINER UTAMA ================= -->
  <div class="relative flex-1">
    <div id="map"></div>

    <!-- FLOATING SEARCH BAR (PERSIS TAMPILAN PENCARIAN ATAS LEAFLET) -->
    <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 w-80 sm:w-96">
      <div class="relative shadow-xl">
        <input 
          id="search-input" 
          type="text" 
          onkeyup="autocompleteCariWilayah()" 
          placeholder="Cari Kab/Kota atau Lokasi di Aceh..." 
          class="w-full bg-white text-slate-800 text-xs md:text-sm pl-4 pr-10 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-emerald-500 shadow-md font-medium"
        />
        <button onclick="cariWilayah()" class="absolute right-3 top-3.5 text-slate-400 hover:text-emerald-600">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <!-- Suggestion List Autocomplete -->
        <div id="search-suggestions" class="absolute top-full left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-xl shadow-2xl max-h-56 overflow-y-auto hidden z-50 text-xs"></div>
      </div>
    </div>

    <!-- TOGGLE BUTTON UNTUK MEMBUKA LAYER CONTROL (JIKA DITUTUP) -->
    <button id="btn-open-layer" onclick="toggleLayerPanel(true)" class="absolute top-4 left-4 z-20 bg-white text-slate-800 hover:text-emerald-600 px-4 py-2.5 rounded-xl shadow-lg border border-slate-200 font-bold text-xs flex items-center gap-2 hidden transition">
      <i class="fa-solid fa-layer-group text-emerald-600"></i> Buka Layer Control
    </button>

    <!-- ================= FLOATING LAYER CONTROL PANEL (PERSIS SEPERTI GAMBAR) ================= -->
    <div id="layer-control-panel" class="absolute top-4 left-4 z-30 w-72 sm:w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col max-h-[85vh] transition-all duration-300">
      
      <!-- Header Panel -->
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
        <h3 class="font-extrabold text-sm text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-emerald-600"></i> Layer Control
        </h3>
        <button onclick="toggleLayerPanel(false)" class="text-slate-400 hover:text-slate-700 text-sm font-bold">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Accordion Groups List (Scrollable) -->
      <div class="p-3 overflow-y-auto custom-scrollbar space-y-2 text-xs">
        
        <!-- 1. BASE MAPS (DROPDOWN) -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-basemap')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Base Maps</span>
            <i id="icon-acc-basemap" class="fa-solid fa-chevron-up text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-basemap" class="p-3 space-y-2 bg-white">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700 hover:text-indigo-600">
              <input type="radio" name="basemap" value="osm" checked onchange="switchBasemap('osm')" class="accent-indigo-600" />
              <span>OpenStreetMap</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700 hover:text-indigo-600">
              <input type="radio" name="basemap" value="satellite" onchange="switchBasemap('satellite')" class="accent-indigo-600" />
              <span>Satellite (Esri World Imagery)</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700 hover:text-indigo-600">
              <input type="radio" name="basemap" value="carto-light" onchange="switchBasemap('carto-light')" class="accent-indigo-600" />
              <span>CartoDB Light</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700 hover:text-indigo-600">
              <input type="radio" name="basemap" value="carto-dark" onchange="switchBasemap('carto-dark')" class="accent-indigo-600" />
              <span>CartoDB Dark</span>
            </label>
          </div>
        </div>

        <!-- 2. PENDUDUK -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-penduduk')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Penduduk</span>
            <i id="icon-acc-penduduk" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-penduduk" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-kepadatan" onchange="toggleLayer('kepadatan')" class="accent-emerald-600 rounded" />
              <span>Kepadatan Penduduk Kab/Kota</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-rentan" onchange="toggleLayer('rentan')" class="accent-emerald-600 rounded" />
              <span>Kelompok Rentan (Lansia & Balita)</span>
            </label>
          </div>
        </div>

        <!-- 3. MITIGASI -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-mitigasi')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Mitigasi</span>
            <i id="icon-acc-mitigasi" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-mitigasi" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-posko" checked onchange="toggleLayer('posko')" class="accent-blue-600 rounded" />
              <span>Posko Siaga & Kantor BPBD</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-shelter" onchange="toggleLayer('shelter')" class="accent-blue-600 rounded" />
              <span>TES (Tempat Evakuasi Sementara)</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-jalur-evakuasi" onchange="toggleLayer('jalur-evakuasi')" class="accent-blue-600 rounded" />
              <span>Jalur Evakuasi Tsunami/Banjir</span>
            </label>
          </div>
        </div>

        <!-- 4. DESTANA (DESA TANGGUH BENCANA) -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-destana')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Destana</span>
            <i id="icon-acc-destana" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-destana" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-destana" checked onchange="toggleLayer('destana')" class="accent-purple-600 rounded" />
              <span>Sebaran Gampong Destana Aceh</span>
            </label>
          </div>
        </div>

        <!-- 5. KEJADIAN BENCANA -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-kejadian')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Kejadian Bencana</span>
            <i id="icon-acc-kejadian" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-kejadian" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-kejadian-terbaru" checked onchange="toggleLayer('kejadian-terbaru')" class="accent-red-600 rounded" />
              <span>Kejadian Bencana Terkini (2026)</span>
            </label>
          </div>
        </div>

        <!-- 6. BAHAYA BENCANA -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-bahaya')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Bahaya Bencana</span>
            <i id="icon-acc-bahaya" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-bahaya" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-sesar" checked onchange="toggleLayer('sesar')" class="accent-red-600 rounded" />
              <span>Patahan Sesar Gempa (Aceh & Seulimeum)</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-bahaya-banjir" onchange="toggleLayer('bahaya-banjir')" class="accent-cyan-600 rounded" />
              <span>Zona Bahaya Banjir DAS</span>
            </label>
          </div>
        </div>

        <!-- 7. KERENTANAN BENCANA -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-kerentanan')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Kerentanan Bencana</span>
            <i id="icon-acc-kerentanan" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-kerentanan" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-kerentanan-sosial" onchange="toggleLayer('kerentanan-sosial')" class="accent-amber-600 rounded" />
              <span>Kerentanan Sosial & Ekonomi</span>
            </label>
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-kerentanan-fisik" onchange="toggleLayer('kerentanan-fisik')" class="accent-amber-600 rounded" />
              <span>Kerentanan Fisik Infrastruktur</span>
            </label>
          </div>
        </div>

        <!-- 8. RISIKO BENCANA -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-risiko')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>Risiko Bencana</span>
            <i id="icon-acc-risiko" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-risiko" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-indeks-risiko" checked onchange="toggleLayer('indeks-risiko')" class="accent-rose-600 rounded" />
              <span>Indeks Risiko 23 Kab/Kota Aceh</span>
            </label>
          </div>
        </div>

        <!-- 9. SPAB (SATUAN PENDIDIKAN AMAN BENCANA) -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <button onclick="toggleAccordion('acc-spab')" class="w-full px-4 py-3 bg-indigo-50/70 hover:bg-indigo-50 text-indigo-900 font-bold flex justify-between items-center transition">
            <span>SPAB</span>
            <i id="icon-acc-spab" class="fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform duration-200"></i>
          </button>
          <div id="acc-spab" class="p-3 space-y-2 bg-white hidden">
            <label class="flex items-center space-x-2.5 cursor-pointer text-slate-700">
              <input type="checkbox" id="layer-spab" checked onchange="toggleLayer('spab')" class="accent-teal-600 rounded" />
              <span>Sekolah Tangguh Bencana (SPAB Aceh)</span>
            </label>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
</body>
</html>
